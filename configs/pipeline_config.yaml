pipeline:
  state_variables:
    - temperature_c
    - power_w
    - airflow_m3s

  sensor_channels:
    - temperature_c
    - power_w
    - airflow_m3s

  anomaly_threshold: 4.0         # Mahalanobis distance threshold
  sensor_weight: 0.65            # sensor vs ROM blend (0=ROM only, 1=sensor only)
  rolling_window: 30             # rolling statistics window size (samples)
  sampling_rate_hz: 1.0          # sensor sampling frequency

  log_output_path: "twin_log.csv"

rom:
  bundle_directory: "./rom_bundles/"
  default_rom: "thermal_rom"
  fallback_to_sensor_only: true  # if ROM fails, use sensor only

alerts:
  email_on_anomaly: false
  anomaly_cooldown_s: 60         # minimum time between anomaly alerts
